name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Rebuild lightningcss
        run: npm rebuild lightningcss

      - name: Build Angular web app
        run: npm run build

      - name: Add Android platform with Capacitor
        env:
          CI: 'true'
          CAPACITOR_TELEMETRY: 'false'
        run: |
          npx @capacitor/cli add android || true

      - name: Generate Android App Icons & Splash Screens
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#0c1024' \
            --iconBackgroundColorDark '#0c1024' \
            --splashBackgroundColor '#0c1024' \
            --splashBackgroundColorDark '#0c1024'

      - name: Configure Landscape, Backdrop Color & Microphone Permissions
        env:
          CI: 'true'
          CAPACITOR_TELEMETRY: 'false'
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"
            fi
            sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/g' "$MANIFEST"
          fi

          # Paint Android window/cutout backdrop #0c1024 so camera cutout margins match game background
          for STYLES in $(find android/app/src/main/res -name "styles.xml"); do
            if grep -q 'name="AppTheme.NoActionBar"' "$STYLES" && ! grep -q 'android:windowBackground' "$STYLES"; then
              sed -i '/<item name="windowNoTitle">true<\/item>/a \        <item name="android:windowBackground">#0c1024<\/item>' "$STYLES"
            fi
          done

          # Also set CoordinatorLayout/DecorView background to #0c1024 in MainActivity.java
          MAIN_ACTIVITY=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          if [ -n "$MAIN_ACTIVITY" ]; then
            cat << 'EOF' > "$MAIN_ACTIVITY"
          package com.itkamianets.yump;

          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  int bgColor = Color.parseColor("#0c1024");
                  getWindow().getDecorView().setBackgroundColor(bgColor);
                  View content = findViewById(android.R.id.content);
                  if (content != null) {
                      content.setBackgroundColor(bgColor);
                  }
                  if (bridge != null && bridge.getWebView() != null && bridge.getWebView().getParent() instanceof View) {
                      ((View) bridge.getWebView().getParent()).setBackgroundColor(bgColor);
                  }
              }
          }
          EOF
          fi

          npx @capacitor/cli sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YUMP-game-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
